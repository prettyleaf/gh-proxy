services:
  gh-proxy:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: gh-proxy:latest
    container_name: gh-proxy
    restart: unless-stopped

    env_file: .env

    # Loopback only. nginx is the sole thing that should be able to reach this;
    # publishing on 0.0.0.0 would expose the proxy on a port that bypasses every
    # rate limit and log setting configured in nginx.
    ports:
      - "127.0.0.1:8899:8899"

    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

    healthcheck:
      test: ["CMD", "/gh-proxy", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
