x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: unless-stopped
  networks:
    - nginx-network # Up to you

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  gh-proxy:
    image: ghcr.io/prettyleaf/gh-proxy:latest
    container_name: gh-proxy
    hostname: gh-proxy
    <<: [*common, *logging, *env]
    ports:
      - "127.0.0.1:8899:8899"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/gh-proxy", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  nginx-network:
    name: nginx-network
    driver: bridge
    external: false
