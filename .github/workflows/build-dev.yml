name: Build Dev

# Every push to dev republishes the :dev tag, so a server pointed at it only has
# to pull. Releases stay in docker.yml, which is driven by v* tags.
on:
  push:
    branches:
      - dev
    # A README-only commit does not change the image.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env.example"
      - "LICENSE"
  workflow_dispatch:

# A newer push makes the running build pointless: :dev would end up pointing at
# whichever of the two finished last.
concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_TAG: dev

jobs:
  notify-start:
    name: Notify (start)
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Checkout
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        uses: actions/checkout@v7

      - name: Send Telegram message
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: pending
          notify_fields: "repo_with_tag,commit,workflow"
          title: "gh-proxy: building :dev image."

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet & format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l -d .; exit 1; }

      - name: Test
        run: go test -race -count=1 ./...

  build-docker-image:
    name: Build & push :dev
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This version string is what /healthz and the status page report, so a
      # dev container can be traced back to the commit it was built from.
      - name: Prepare build metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # The binary is pure Go and cross-compiles in the build stage, so the
          # second architecture costs a compile, not a QEMU emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_IMAGE }}:dev-${{ steps.meta.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.sha_short }}
            BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the package listing to the two real platforms instead of
          # padding it with unknown/unknown attestation entries.
          provenance: false

  notify:
    name: Notify (finish)
    needs: [test, build-docker-image]
    # Reports a failed test job too, but stays quiet when a newer push cancelled
    # this run — that is not news.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Read through env rather than the secrets context so the step condition
    # below can silently skip when no bot is configured.
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Checkout
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        uses: actions/checkout@v7

      - name: Send Telegram message
        if: ${{ env.TELEGRAM_TOKEN != '' }}
        uses: proDreams/actions-telegram-notifier@main
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          # The real outcome, not this job's own (which is always a success).
          # Anything short of a pushed image is a failure, including a test job
          # that failed and left the build skipped.
          status: ${{ needs.build-docker-image.result == 'success' && 'success' || 'failure' }}
          notify_fields: "repo_with_tag,commit,workflow"
          title: "gh-proxy :dev build ${{ needs.build-docker-image.result }}."
